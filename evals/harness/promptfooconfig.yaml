# Controlled replay for evals/cases/2026-08-03-chat-history.md.
# `npm test` validates this configuration only. `npm run controlled-eval` is the
# explicit, potentially billable operator action; it runs neither in CI nor on a schedule.
description: chat-history controlled comparison (evals/cases/2026-08-03-chat-history.md)

prompts:
  - "{{question}}"

# The two workspaces must contain the same corpus fixture and differ only in whether
# `.agents/skills/chat-history/` is present. Both are disposable directories outside this repo.
# The isolated home contains no personal skills. CODEX_HOME holds the exact
# `chat_history_researcher` profile for both conditions, so the skill text is the only difference.
providers:
  - id: openai:codex-sdk
    label: current-skill
    config:
      working_dir: "{{ env.CHAT_HISTORY_EVAL_CURRENT_SKILL_WORKSPACE }}"
      skip_git_repo_check: true
      sandbox_mode: workspace-write
      approval_policy: never
      enable_streaming: true
      cli_env:
        CODEX_HOME: "{{ env.CHAT_HISTORY_EVAL_CODEX_HOME }}"
        HOME: "{{ env.CHAT_HISTORY_EVAL_HOME }}"
        USERPROFILE: "{{ env.CHAT_HISTORY_EVAL_HOME }}"
  - id: openai:codex-sdk
    label: no-skill-baseline
    config:
      working_dir: "{{ env.CHAT_HISTORY_EVAL_BASELINE_WORKSPACE }}"
      skip_git_repo_check: true
      sandbox_mode: workspace-write
      approval_policy: never
      enable_streaming: true
      cli_env:
        CODEX_HOME: "{{ env.CHAT_HISTORY_EVAL_CODEX_HOME }}"
        HOME: "{{ env.CHAT_HISTORY_EVAL_HOME }}"
        USERPROFILE: "{{ env.CHAT_HISTORY_EVAL_HOME }}"

tests:
  - description: "Scenario A — Scope Atlas provenance reconstruction (current skill)"
    providers: [current-skill]
    options:
      repeat: 3
    vars:
      question: >-
        Can you help me track down which of my products or projects eventually started out as
        something called Scope Atlas or something like that? I don't remember what it ended up
        transforming into. You can search pieces MCP as well.
    assert:
      - type: skill-used
        value: chat-history
        metric: skill-fired
      - type: icontains-any
        value: ["Semantic Context Planner", "Semantic-Planner"]
        metric: G1-names-ground-truth
      - type: contains
        value: 019f1bbb-a218-7030-81ad-8486fbe74dc2
        metric: G2-provenance

  - description: "Scenario A — Scope Atlas provenance reconstruction (no-skill baseline)"
    providers: [no-skill-baseline]
    options:
      repeat: 3
    vars:
      question: >-
        Can you help me track down which of my products or projects eventually started out as
        something called Scope Atlas or something like that? I don't remember what it ended up
        transforming into. You can search pieces MCP as well.
    assert:
      - type: not-skill-used
        value: chat-history
        metric: skill-not-fired
      - type: icontains-any
        value: ["Semantic Context Planner", "Semantic-Planner"]
        metric: G1-names-ground-truth
      - type: contains
        value: 019f1bbb-a218-7030-81ad-8486fbe74dc2
        metric: G2-provenance

  - description: "Scenario B — lost-context directed retrieval (current skill)"
    providers: [current-skill]
    options:
      repeat: 3
    vars:
      question: >-
        You have no memory of creating these files: graphiti_f4, INGESTION_GOVERNANCE,
        INGESTION_RATIONALE. You have no idea why they're named what they are. Dispatch a
        subagent to take a look and find if you can this conversation in the previous Claude Code
        history. Figure out what the hell was going on. Do not use llm-archiver — it is not a
        reliable source; read the Claude Code conversations from the JSONL itself.
    assert:
      - type: skill-used
        value: chat-history
        metric: skill-fired
      - type: javascript
        value: |
          const session = '98e65f4c-c84d-4629-94ac-e1808aa97d68';
          const escaped = session.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const result = new RegExp(
            `(?:created|originated|came from).{0,120}${escaped}|${escaped}.{0,120}(?:created|originated|origin|source)`,
            'is',
          ).test(output);
          return {
            pass: result,
            score: result ? 1 : 0,
            reason: result
              ? 'Connects the known session to the files\' origin.'
              : 'Does not connect the known session to the files\' origin.',
          };
        metric: G1-names-ground-truth
      - type: contains
        value: 98e65f4c-c84d-4629-94ac-e1808aa97d68
        metric: G2-provenance

  - description: "Scenario B — lost-context directed retrieval (no-skill baseline)"
    providers: [no-skill-baseline]
    options:
      repeat: 3
    vars:
      question: >-
        You have no memory of creating these files: graphiti_f4, INGESTION_GOVERNANCE,
        INGESTION_RATIONALE. You have no idea why they're named what they are. Dispatch a
        subagent to take a look and find if you can this conversation in the previous Claude Code
        history. Figure out what the hell was going on. Do not use llm-archiver — it is not a
        reliable source; read the Claude Code conversations from the JSONL itself.
    assert:
      - type: not-skill-used
        value: chat-history
        metric: skill-not-fired
      - type: javascript
        value: |
          const session = '98e65f4c-c84d-4629-94ac-e1808aa97d68';
          const escaped = session.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const result = new RegExp(
            `(?:created|originated|came from).{0,120}${escaped}|${escaped}.{0,120}(?:created|originated|origin|source)`,
            'is',
          ).test(output);
          return {
            pass: result,
            score: result ? 1 : 0,
            reason: result
              ? 'Connects the known session to the files\' origin.'
              : 'Does not connect the known session to the files\' origin.',
          };
        metric: G1-names-ground-truth
      - type: contains
        value: 98e65f4c-c84d-4629-94ac-e1808aa97d68
        metric: G2-provenance
