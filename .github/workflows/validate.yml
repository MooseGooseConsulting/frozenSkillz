name: Validate frozenSkillz

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-general' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-python ships only Ubuntu-built interpreters, so it fails on the
      # self-hosted runner ("version '3.13' ... was not found for Garuda Soaring").
      # uv is a static binary and fetches python-build-standalone, so this resolves
      # identically on the self-hosted runner and on the hosted fork fallback.
      - name: Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Install validation dependencies
        run: uv pip install -r requirements-validation.txt

      - name: Check for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=HEAD^
          fi
          # Scout source trees are verbatim third-party snapshots (read-only evidence);
          # style gates do not apply to them.
          git diff --check "$BASE_SHA" HEAD -- . ':(exclude)_incubator/scout/*/source/**'

      - name: Validate plugin manifests
        run: python scripts/validate_manifests.py

      - name: Test local skill synchronization
        run: python -m unittest discover -s tests -v

      - name: Smoke-test a fresh local skill root
        run: |
          target="${RUNNER_TEMP}/frozen-skills-smoke"
          python scripts/sync_frozen_skills.py --consumer codex --apply --destination "$target"
          python scripts/sync_frozen_skills.py --consumer codex --check --destination "$target"
